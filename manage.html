<div class="sillynpc sillynpc-manage">
    <div class="sillynpc-manage-layout">
        <div class="sillynpc-tabs">
            <div id="sillynpc-settings-search"></div>
            <div class="sillynpc-sections" role="tablist" aria-label="Settings sections">
                <button type="button" class="sillynpc-section active" data-section="cast" role="tab" aria-selected="true">Cast</button>
                <button type="button" class="sillynpc-section" data-section="systems" data-tab="systems" role="tab" aria-selected="false">System</button>
                <button type="button" class="sillynpc-section" data-section="dialogue" data-tab="writing" role="tab" aria-selected="false">Dialogue</button>
                <button type="button" class="sillynpc-section" data-section="status" data-tab="status" role="tab" aria-selected="false">Tracker</button>
                <button type="button" class="sillynpc-section" data-section="lorebook" data-tab="lorebook" role="tab" aria-selected="false">Lorebook</button>
                <button type="button" class="sillynpc-section" data-section="images" data-tab="images" role="tab" aria-selected="false">Images</button>
                <button type="button" class="sillynpc-section" data-section="appearance" data-tab="appearance" role="tab" aria-selected="false">Appearance</button>
                <button type="button" class="sillynpc-section" data-section="more" data-tab="advanced" role="tab" aria-selected="false">Extension</button>
            </div>
        </div>
        <div class="sillynpc-manage-content">
            <div class="sillynpc-subtabs" role="tablist" aria-label="Cast views">
                <button type="button" class="sillynpc-tab active" data-tab="characters" role="tab" aria-selected="true">Characters</button>
                <button type="button" class="sillynpc-tab" data-tab="player" role="tab" aria-selected="false">Player</button>
            </div>
            <div class="sillynpc-tab-panel" data-panel="characters">
                <div id="sillynpc-grid-view">
                    <div class="sillynpc-card-grid" id="sillynpc-card-grid"></div>
                </div>
                <div id="sillynpc-editor-view" style="display: none;"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="player" style="display: none;">
                <div id="sillynpc-player-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="appearance" style="display: none;">
                <div id="sillynpc-appearance-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="writing" style="display: none;">
                <div id="sillynpc-writing-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="status" style="display: none;">
                <div id="sillynpc-status-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="systems" style="display: none;">
                <div id="sillynpc-systems-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="lorebook" style="display: none;">
                <div id="sillynpc-lorebook-settings-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="images" style="display: none;">
                <div id="sillynpc-image-settings-view"></div>
            </div>

            <div class="sillynpc-tab-panel" data-panel="advanced" style="display: none;">
                <div id="sillynpc-advanced-view"></div>
            </div>
        </div>
    </div>
</div>
